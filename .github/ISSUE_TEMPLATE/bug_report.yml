name: Bug Report
description: File a bug report to help us improve Piccolo.jl
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Include a minimal Julia script that triggers the issue.
      render: julia
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Piccolo.jl Version
    validations:
      required: true
  - type: input
    id: julia_version
    attributes:
      label: Julia Version
  - type: textarea
    id: logs
    attributes:
      label: Log Output
      render: shell
