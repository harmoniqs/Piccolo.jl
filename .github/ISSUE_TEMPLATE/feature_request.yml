name: Feature Request
description: Suggest an idea for Piccolo.jl
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting a feature.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: textarea
    id: context
    attributes:
      label: Additional Context
